name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint (php-cs-fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --ansi

      - name: Type check (phpstan)
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit --colors=always

      - name: Security audit (composer)
        run: composer audit --no-dev --format=plain

  e2e:
    name: E2E smoke test
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      TINYOWL_API_KEY: ${{ secrets.TINYOWL_API_KEY }}
      TINYOWL_PROJECT_SECRET: ${{ secrets.TINYOWL_PROJECT_SECRET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, json
          coverage: none
          tools: composer:v2

      - name: Install SDK
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Skip if secrets missing
        id: secrets
        run: |
          if [ -z "$TINYOWL_API_KEY" ] || [ -z "$TINYOWL_PROJECT_SECRET" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "TINYOWL_API_KEY / TINYOWL_PROJECT_SECRET not set — skipping E2E."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run smoke test
        if: steps.secrets.outputs.skip == 'false'
        run: php examples/basic.php

      - name: Run PHPUnit E2E suite
        if: steps.secrets.outputs.skip == 'false'
        run: vendor/bin/phpunit --testsuite e2e --colors=always
